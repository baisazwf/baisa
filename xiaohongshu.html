<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书 · 发现</title>
<style>
  :root{
    --red:#ff2442;
    --red-dark:#e51c38;
    --red-soft:#fff0f2;
    --text:#1f1f1f;
    --text2:#4d4d4d;
    --sub:#9a9a9a;
    --line:#f0f0f0;
    --chip:#f6f6f6;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:#fff;color:var(--text);overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#dcdcdc;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#c4c4c4}

  /* ============ 左侧导航 ============ */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:212px;
    padding:22px 14px 18px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:4px;background:#fff;z-index:60;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:0 10px 20px}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;background:var(--red);color:#fff;
    display:grid;place-items:center;font-size:16px;font-weight:800;
    box-shadow:0 4px 10px rgba(255,36,66,.32);
  }
  .brand-name{font-size:17px;font-weight:800;letter-spacing:.5px}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
    font-size:15px;color:var(--text2);font-weight:500;transition:.16s;width:100%;text-align:left;
  }
  .nav-item .ic{font-size:18px;width:22px;text-align:center}
  .nav-item:hover{background:#fafafa}
  .nav-item.on{background:var(--red-soft);color:var(--red);font-weight:700}
  .nav-item.pub{background:var(--red);color:#fff;justify-content:center;font-weight:700;margin:6px 0 10px;
    box-shadow:0 6px 16px rgba(255,36,66,.3);}
  .nav-item.pub:hover{background:var(--red-dark)}
  .side-cap{font-size:12px;color:var(--sub);padding:14px 14px 8px;letter-spacing:.4px}
  .follow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;font-size:13.5px;color:var(--text2);
    width:100%;text-align:left;transition:.15s}
  .follow:hover{background:#fafafa}
  .av{
    width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;
    background:var(--chip);
  }
  .side-foot{margin-top:auto;font-size:11px;color:#c2c2c2;padding:10px 14px;line-height:1.7}

  /* ============ 主体 ============ */
  .main{margin-left:212px;min-height:100vh}
  .topbar{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
    padding:14px 32px 0;display:flex;flex-direction:column;gap:13px;
  }
  .tb-row{display:flex;align-items:center;gap:10px;min-height:34px}
  .tb-row.tabs-row{padding-bottom:5px;border-bottom:1px solid #f0f0f0}
  .tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:6px 12px;border-radius:6px;font-size:15px;color:#666;white-space:nowrap;
    font-weight:400;transition:color .16s;
  }
  .tab:hover{color:#1f1f1f}
  .tab.on{color:#1f1f1f;font-weight:600}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:99px;
    padding:9px 16px;width:460px;max-width:54vw;flex:none;transition:.2s;
  }
  .search:focus-within{background:#fff;box-shadow:0 0 0 2px var(--red) inset,0 4px 14px rgba(0,0,0,.06)}
  .search input{flex:1;font-size:13.5px;min-width:0}
  .search .mag{color:var(--sub);font-size:14px}
  .bell{position:relative;font-size:19px;padding:6px;border-radius:10px;transition:.15s}
  .bell:hover{background:#fafafa}
  .bell .dot{position:absolute;top:2px;right:0;min-width:16px;height:16px;border-radius:9px;background:var(--red);
    color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
  .me-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb3c1,#ff6f8b);
    display:grid;place-items:center;font-size:17px;cursor:pointer;border:2px solid #fff;
    box-shadow:0 2px 8px rgba(255,36,66,.25)}

  .feed{position:relative;padding:8px 32px 120px;transition:height .3s}
  .card{
    position:absolute;top:0;left:0;width:240px;
    transition:transform .38s cubic-bezier(.22,.8,.28,1);cursor:pointer;
  }
  .card .cover{
    position:relative;border-radius:8px;overflow:hidden;isolation:isolate;background:#f2f2f2;
  }
  .card .cover .layer{position:absolute;inset:0}
  .card .cover::after{
    content:"";position:absolute;inset:0;border-radius:8px;
    box-shadow:0 0 0 1px rgba(0,0,0,.05) inset;pointer-events:none;z-index:2;
  }
  .cv-img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .45s cubic-bezier(.22,.9,.3,1);user-select:none;
  }
  .card:hover .cv-img{transform:scale(1.06)}
  .card:hover .cv-emoji{transform:scale(1.09) rotate(-4deg)}
  .card:hover .cover{box-shadow:0 10px 24px rgba(0,0,0,.1)}
  .cv-emoji{
    position:absolute;inset:0;display:grid;place-items:center;font-size:62px;
    transition:transform .45s cubic-bezier(.22,.9,.3,1);filter:drop-shadow(0 8px 14px rgba(0,0,0,.14));
  }
  .cv-big{
    position:absolute;left:16px;right:16px;bottom:16px;font-size:21px;font-weight:900;line-height:1.28;
    letter-spacing:.5px;word-break:break-word;
  }
  .cv-tag{
    position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(4px);display:flex;align-items:center;gap:3px;
  }
  .cv-tag.hot{background:var(--red);box-shadow:0 3px 10px rgba(255,36,66,.4)}
  .cv-fwd{
    position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:rgba(255,255,255,.92);color:var(--red);
  }
  .cv-loc{
    position:absolute;left:14px;top:12px;font-size:11px;color:rgba(255,255,255,.92);
    display:flex;gap:3px;align-items:center;
  }
  .c-meta{padding:9px 2px 0}
  .c-title{font-size:14px;font-weight:500;line-height:1.4;color:#333;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .c-sub{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
  .c-user{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
  .c-user .av{width:20px;height:20px;font-size:11px}
  .c-user span{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-like{display:flex;align-items:center;gap:3px;font-size:12px;color:#9a9a9a;flex:none;font-weight:500}
  .c-like .ico{width:15px;height:15px;flex:none;transition:transform .18s}
  .c-like.on{color:var(--red)}
  .c-like.on .ico{animation:likeBounce .42s ease-out}
  .c-like:hover .ico{transform:scale(1.14)}

  /* ============ 弹层通用 ============ */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;visibility:hidden;
    transition:.22s;display:grid;place-items:center;padding:24px;
  }
  .mask.show{opacity:1;visibility:visible}
  .panel{
    background:#fff;border-radius:20px;transform:scale(.96) translateY(8px);transition:.26s cubic-bezier(.2,.9,.3,1);
    max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.28);
  }
  .mask.show .panel{transform:none}

  /* 详情 */
  #detailPanel{width:min(1040px,100%);height:min(700px,90vh)}
  .d-grid{display:grid;grid-template-columns:1.06fr .94fr;height:100%;min-height:0}
  .d-stage{
    position:relative;background:#f5f5f5;display:grid;place-items:center;overflow:hidden;
    border-radius:20px 0 0 20px;
  }
  .d-img{position:relative;width:100%;height:100%;overflow:hidden;cursor:pointer}
  .d-img .cv-img{object-fit:contain;transition:none}
  .d-img .cv-emoji{font-size:130px}
  .d-img .cv-big{font-size:30px;left:36px;right:36px;bottom:36px}
  .d-close{
    position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;z-index:6;
    background:rgba(0,0,0,.32);color:#fff;font-size:15px;display:grid;place-items:center;
    backdrop-filter:blur(6px);transition:.16s;line-height:1;
  }
  .d-close:hover{background:rgba(0,0,0,.5);transform:scale(1.06)}
  .d-nav{
    position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:14px;color:#333;z-index:3;
    box-shadow:0 3px 12px rgba(0,0,0,.14);transition:.15s;
  }
  .d-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
  .d-nav.prev{left:14px}.d-nav.next{right:14px}
  .d-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
  .d-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
  .d-dots i.on{background:#fff;width:16px;border-radius:99px}
  .d-thumbs{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4}
  .d-thumbs img,.d-thumbs .th{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:16px;
    border:2px solid transparent;opacity:.72;cursor:pointer;transition:.15s}
  .d-thumbs .th.on{border-color:#fff;opacity:1;transform:translateY(-2px)}
  .heart-pop{
    position:absolute;font-size:80px;pointer-events:none;animation:pop .8s ease-out forwards;z-index:9;
  }
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
    35%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    100%{transform:translate(-50%,-90%) scale(.7);opacity:0}
  }

  .d-side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
  .d-head{display:flex;align-items:center;gap:10px;padding:18px 22px 12px;flex:none}
  .d-head .av{width:38px;height:38px;font-size:19px}
  .d-uinfo{flex:1;min-width:0}
  .d-uname{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px}
  .d-ubio{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-follow{
    font-size:12.5px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:99px;
    padding:5px 15px;transition:.16s;flex:none;
  }
  .d-follow:hover{background:var(--red-soft)}
  .d-follow.on{color:var(--sub);border-color:#e2e2e2}
  .d-follow.on:hover{background:#fafafa}
  .d-body{flex:1;overflow-y:auto;padding:0 22px 14px;min-height:0}
  .d-title{font-size:17px;font-weight:800;line-height:1.4;margin:2px 0 10px}
  .d-text{font-size:14.5px;line-height:1.85;color:#2c2c2c;white-space:pre-wrap;word-break:break-word}
  .d-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .d-tags b{font-size:12.5px;color:#1e4bd8;font-weight:600}
  .d-info{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .d-fwd-badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--red-soft);color:var(--red);
    font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;margin-bottom:12px;
  }
  .d-cmt-cap{
    font-size:13px;color:var(--sub);padding:16px 0 10px;border-top:1px solid var(--line);margin-top:18px;
    display:flex;gap:8px;align-items:center;
  }
  .cmt{display:flex;gap:10px;padding:10px 0}
  .cmt .av{width:30px;height:30px;font-size:15px}
  .cmt-main{flex:1;min-width:0}
  .cmt-name{font-size:12px;color:var(--sub);font-weight:600}
  .cmt-text{font-size:13.5px;line-height:1.65;margin-top:3px;word-break:break-word;color:#2c2c2c}
  .cmt-foot{display:flex;align-items:center;gap:18px;margin-top:6px;font-size:11.5px;color:#9a9a9a}
  .cmt-foot .act{display:inline-flex;align-items:center;gap:4px;transition:.15s}
  .cmt-foot .act .ico{width:14px;height:14px;flex:none;transition:transform .18s}
  .cmt-foot .act:hover{color:#333}
  .cmt-foot .act:hover .ico{transform:scale(1.14)}
  .cmt-foot .act.on{color:var(--red)}
  .cmt-foot .act.on .ico{animation:likeBounce .42s ease-out}
  .cmt-reply{margin-left:0;padding-left:0}
  /* ===== 底部操作栏：对齐小红书网页版 ===== */
  .xhs-foot{
    flex:none;display:flex;align-items:center;gap:2px;
    padding:9px 16px 11px;border-top:1px solid #f0f0f0;background:#fff;
  }
  .xhs-input{
    flex:1;min-width:60px;display:flex;align-items:center;height:38px;background:#f5f5f5;
    border-radius:19px;padding:0 4px 0 16px;margin-right:6px;transition:background .18s;
  }
  .xhs-input:focus-within{background:#efefef}
  .xhs-input input{flex:1;min-width:0;font-size:14px;color:#333}
  .xhs-input input::placeholder{color:#b3b3b3}
  .xhs-send{
    font-size:13.5px;font-weight:600;color:var(--red);padding:6px 11px;border-radius:15px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .16s;
  }
  .xhs-send.show{opacity:1;pointer-events:auto}
  .xhs-send:hover{background:#fff0f2}
  .xhs-acts{display:flex;align-items:center;gap:1px;flex:none}
  .xhs-act{
    display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;
    color:#1f1f1f;flex:none;transition:background .16s;
  }
  .xhs-act:hover{background:#f7f7f7}
  .xhs-act.on{color:var(--red)}
  .xhs-act .ico{width:24px;height:24px;flex:none;transition:transform .18s}
  .xhs-act:hover .ico{transform:scale(1.07)}
  .xhs-act.on .ico{animation:likeBounce .42s ease-out}
  .xhs-act .num{font-size:13px;color:#666;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .xhs-act.on .num{color:var(--red)}
  @keyframes likeBounce{
    0%{transform:scale(1)}35%{transform:scale(1.34)}65%{transform:scale(.9)}100%{transform:scale(1)}
  }
  .d-spacer{flex:1}
  .send{
    background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:9px 18px;border-radius:99px;transition:.16s;
  }
  .send:hover{background:var(--red-dark)}
  .send:disabled{background:#f2c6cd;cursor:not-allowed}

  /* 发布 */
  #pubPanel{width:min(760px,100%)}
  .p-head{display:flex;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);flex:none}
  .p-head h3{margin:0;font-size:16px;flex:1;font-weight:800}
  .p-close{font-size:20px;color:var(--sub);padding:2px 6px;border-radius:8px}
  .p-close:hover{background:#f5f5f5}
  .p-body{padding:20px 24px;overflow-y:auto}
  .p-label{font-size:12.5px;color:var(--sub);font-weight:700;margin:0 0 10px;letter-spacing:.3px}
  .p-covers{display:flex;gap:10px;flex-wrap:wrap}
  .p-cv{
    width:74px;height:74px;border-radius:12px;display:grid;place-items:center;font-size:30px;
    border:2px solid transparent;cursor:pointer;transition:.15s;
  }
  .p-cv.on{border-color:var(--red);transform:translateY(-3px);box-shadow:0 8px 18px rgba(255,36,66,.2)}
  .p-upload{
    border:1.5px dashed #d8d8d8;background-color:#fafafa;color:#a0a0a0;font-size:24px;font-weight:300;
    background-size:cover;background-position:center;position:relative;overflow:hidden;
  }
  .p-upload:hover{border-color:var(--red);color:var(--red)}
  .p-upload.has{border-style:solid;border-color:var(--red);font-size:0}
  .p-upload.has::before{
    content:"换一张";position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:600;
    background:rgba(0,0,0,.45);color:#fff;padding:3px 0;text-align:center;
  }
  .p-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .p-emo{width:42px;height:42px;border-radius:11px;background:var(--chip);display:grid;place-items:center;font-size:20px;
    border:2px solid transparent;transition:.15s}
  .p-emo:hover{background:#eee}
  .p-emo.on{border-color:var(--red);background:var(--red-soft)}
  .p-grad{width:42px;height:42px;border-radius:11px;border:2px solid transparent;transition:.15s}
  .p-grad.on{border-color:var(--red);transform:scale(1.06)}
  .p-title{
    width:100%;font-size:16px;font-weight:700;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px;
  }
  .p-text{
    width:100%;font-size:14px;line-height:1.8;min-height:130px;resize:vertical;padding:4px 0;
    border-bottom:1px solid var(--line);
  }
  .p-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
  .p-tag{font-size:12.5px;color:#1e4bd8;background:#f0f4ff;padding:5px 12px;border-radius:99px;font-weight:600}
  .p-tag:hover{background:#e3ecff}
  .p-foot{display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--line);flex:none}
  .p-count{font-size:12px;color:var(--sub);flex:1}
  .ghost{font-size:13px;font-weight:700;padding:10px 20px;border-radius:99px;background:var(--chip);transition:.16s}
  .ghost:hover{background:#ebebeb}

  /* 分享 / 转发 */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:130;
    transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
    padding:20px 26px 30px;max-width:600px;margin:0 auto;box-shadow:0 -14px 40px rgba(0,0,0,.18);
  }
  .sheet.show{transform:none}
  .sh-title{font-size:15px;font-weight:700;margin:0 0 14px;text-align:center;color:#1f1f1f}
  .sh-preview{
    display:flex;align-items:center;gap:11px;background:#f7f7f7;border-radius:12px;padding:9px 12px;margin-bottom:20px;
  }
  .sh-thumb{width:42px;height:42px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:20px;overflow:hidden}
  .sh-ptitle{font-size:13px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;
    -webkit-box-orient:vertical;overflow:hidden;color:#1f1f1f}
  .sh-puser{font-size:11.5px;color:#9a9a9a;margin-top:3px}
  .sh-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 6px}
  .sh-item{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#616161}
  .sh-ico{
    width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;
    transition:transform .16s,filter .16s;
  }
  .sh-ico .ico{width:24px;height:24px}
  .sh-item:hover .sh-ico{transform:translateY(-3px) scale(1.05);filter:brightness(1.06)}
  .sh-item:active .sh-ico{transform:scale(.94)}
  .sh-svg{width:24px;height:24px;display:block}
  .sh-fwd{margin-top:20px;display:none}
  .sh-fwd.show{display:block}
  .sh-fwd textarea{
    width:100%;background:var(--chip);border-radius:12px;padding:12px 14px;font-size:13.5px;min-height:64px;
    resize:none;line-height:1.6;
  }
  .sh-fwd .row{display:flex;justify-content:flex-end;margin-top:12px}
  .sh-cancel{width:100%;margin-top:18px;padding:12px;border-radius:14px;background:var(--chip);font-size:14px;font-weight:700}
  .sh-cancel:hover{background:#ebebeb}

  /* 通知 */
  #notiPanel{width:min(430px,100%);max-height:76vh}
  .n-item{display:flex;gap:12px;padding:14px 22px;border-bottom:1px solid #fafafa}
  .n-item .av{width:36px;height:36px;font-size:18px}

function lum(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
function txtColor(g){ return lum(g[0]) > .74 ? '#4a2b33' : '#ffffff'; }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1900);
}
function shade(hex, amt){
  const c = hex.replace('#','');
  let r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  r = Math.min(255,Math.max(0,r+amt)); g = Math.min(255,Math.max(0,g+amt)); b = Math.min(255,Math.max(0,b+amt));
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function filtered(){
  return notes.filter(n => {
    if(n.forwardOf && curTab !== '推荐'){ /* 转发帖只出现在推荐 */ }
    if(curTab !== '推荐' && n.cat !== curTab) return false;
    if(keyword){
      const k = keyword.toLowerCase();
      const hay = (n.title + n.body + n.user.n + (n.forwardOf ? '转发' : '')).toLowerCase();
      if(!hay.includes(k)) return false;
    }
    return true;
  });
}

function cardHTML(n){

      ${n.covers.length > 1 ? `<div class="cv-tag" style="top:auto;bottom:12px;left:auto;right:12px">${n.covers.length}图</div>` : ''}
      ${n.forwardOf ? `<div class="cv-fwd"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M14.8 7l5.4 5-5.4 5"/><path d="M4.2 19.4C4.2 13.6 7.7 12 14.8 12"/></svg> 转发自 @${esc(n.forwardOf.n)}</div>` : ''}

function renderFeed(){

      这里还没有内容 · 换个词或者自己去发一条吧</div>`;
    feed.style.height = '240px'; return;
  }
  feed.innerHTML = list.map(n =>
    `<article class="card" data-id="${n.id}" data-ratio="${n.ratio || 1.333}">${cardHTML(n)}</article>`
  ).join('');
  requestAnimationFrame(layout);
}

let layoutTimer;
function layout(){
  const feed = $('#feed');
  const cards = [...feed.querySelectorAll('.card')];
  if(!cards.length) return;
  const W = feed.clientWidth;
  const gap = 18, minW = 216;
  let cols = Math.max(2, Math.min(5, Math.floor((W + gap) / (minW + gap))));
  if(W < 520) cols = 2;
  const colW = (W - gap * (cols - 1)) / cols;
  const hs = new Array(cols).fill(0);
  cards.forEach(c => {
    c.style.width = colW + 'px';
    const cvEl = c.querySelector('.cover');
    const r = parseFloat(c.dataset.ratio) || 1.333;
    if(cvEl) cvEl.style.height = Math.round(colW * r) + 'px';
    const h = c.offsetHeight;
    let k = 0;
    for(let i = 1; i < cols; i++) if(hs[i] < hs[k] - 0.6) k = i;
    c.style.transform = `translate(${(k * (colW + gap)).toFixed(1)}px, ${hs[k].toFixed(1)}px)`;
    hs[k] += h + gap;
  });
  feed.style.height = (Math.max(...hs) + 10) + 'px';
}
window.addEventListener('resize', () => {
  clearTimeout(layoutTimer); layoutTimer = setTimeout(layout, 120);
});

  {e:'🧊', big:'冰箱里有一瓶过期两年的酱', t:'我家冰箱有一瓶过期两年的酱，我没舍得扔', b:'是搬家时朋友送的，一直没用过。\n每次清理冰箱我拿起来看一眼，然后又放回去。\n\n我知道它不能吃了。但我就是不想扔。'}
];
$('#pubRandom').onclick = () => {
  const s = RANDOM_SEEDS[Math.floor(Math.random()*RANDOM_SEEDS.length)];
  pickedEmoji = s.e; pickedCover = Math.floor(Math.random()*6); pickedPhoto = '';
  $('#pubBig').value = s.big; $('#pubTitle').value = s.t; $('#pubText').value = s.b;
  $('#pubCount').textContent = s.b.length + ' 字';
  buildPubPickers();
  toast('帮你填好了，改改再发');
};
$('#pubText').addEventListener('input', e => { $('#pubCount').textContent = e.target.value.length + ' 字'; });

function openPub(){
  pickedCover = Math.floor(Math.random()*6);
  pickedEmoji = EMO_POOL[Math.floor(Math.random()*EMO_POOL.length)];
  pickedPhoto = '';
  pubTags = []; $('#pubBig').value = ''; $('#pubTitle').value = ''; $('#pubText').value = '';
  $('#pubCount').textContent = '0 字';
  buildPubPickers();
  $('#pubMask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closePub(){ $('#pubMask').classList.remove('show'); document.body.style.overflow = ''; }
$('#navPub').onclick = openPub;
$('#mobPub').onclick = openPub;
$('#pubClose').onclick = closePub;
$('#pubMask').addEventListener('click', e => { if(e.target.id === 'pubMask') closePub(); });

$('#pubSubmit').onclick = () => {
  const title = $('#pubTitle').value.trim();
  const body = $('#pubText').value.trim();
  if(!title && !body) return toast('标题和正文总得有一个');
  const g = GRAD_POOL[pickedCover % GRAD_POOL.length];
  const big = $('#pubBig').value.trim();
  const nt = {
    id: nid(), cat: (pubTags[0] || '#生活记录').replace('#','').slice(0,3) || '生活',
    city:'我这边', time:'刚刚', hot:false,
    photo: pickedPhoto, ratio: 1.333,
    title: title || big || '（无标题）',
    body: body || '（正文空着，也是一种态度）',
    tags: pubTags.length ? pubTags : ['#生活记录'],
    covers: [{ e:pickedEmoji, g:[g[0],g[1]], big: big || '' }],
    user:{ n:ME.name, a:ME.av, bio:'刚刚开始用小红书' },
    likes:0, collects:0, forwards:0, comments:[], mine:true
  };
  notes.unshift(nt);
  closePub();
  curTab = '推荐'; keyword = ''; $('#searchInput').value = '';
  renderTabs(); renderFeed();
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(() => toast('发布成功，正在给你的笔记配流量（没有）'), 240);
};

/* =======================================================================
   通知
======================================================================= */
const NOTIS = [
  {a:'🧁', n:'奶芙芙', t:'赞了你的笔记 <b>「我把前男友送的绿萝养死了」</b>', time:'2分钟前'},
  {a:'👻', n:'已注销', t:'评论了你：<b>姐妹你说得对，但我想补充一句</b>', time:'18分钟前'},
  {a:'🌾', n:'小满', t:'收藏了你的笔记 <b>「楼道里的共享单车」</b>', time:'1小时前'},
  {a:'🐟', n:'不睡觉的鱼', t:'关注了你', time:'3小时前'},
  {a:'🍉', n:'吃瓜不吐皮', t:'转发了你的笔记 <b>「小区电梯广告」</b>', time:'昨天'},
  {a:'🐶', n:'阿柴今天也很困', t:'回复了你的评论：<b>哈哈哈哈笑到了</b>', time:'昨天'}
];
$('#notiBody').innerHTML = NOTIS.map(x => `
  <div class="n-item">
    <div class="av">${x.a}</div>
    <div>
      <div class="n-main"><b>${esc(x.n)}</b> ${x.t}</div>
      <div class="n-time">${x.time}</div>
    </div>
  </div>`).join('');
function openNoti(){ $('#notiMask').classList.add('show'); $('#bellDot').style.display = 'none'; }
$('#bellBtn').onclick = openNoti;
$('#navNoti').onclick = openNoti;
$('#mobNoti').onclick = openNoti;
$('#notiClose').onclick = () => $('#notiMask').classList.remove('show');
$('#notiMask').addEventListener('click', e => { if(e.target.id === 'notiMask') $('#notiMask').classList.remove('show'); });

$('#navMe').onclick = () => toast('这是你自己的主页（还没做）');
$('#meBtn').onclick = () => toast('那是你：1 篇笔记 · 0 个粉丝');

/* 搜索 */
let sTimer;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(sTimer);
  sTimer = setTimeout(() => { keyword = e.target.value.trim(); renderFeed(); }, 220);
});

/* 关闭详情 */
$('#dClose').onclick = closeDetail;
$('#detailMask').addEventListener('click', e => { if(e.target.id === 'detailMask') closeDetail(); });
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#shSheet').classList.contains('show')) return closeShare();
  if($('#pubMask').classList.contains('show')) return closePub();
  if($('#notiMask').classList.contains('show')) return $('#notiMask').classList.remove('show');
  if($('#detailMask').classList.contains('show')) return closeDetail();
});

/* =======================================================================
   启动
======================================================================= */
renderTabs();
renderFollows();
renderShareGrid();
renderFeed();
setTimeout(layout, 120);
setTimeout(() => toast('欢迎来到小红书 · 随手翻翻'), 700);
</script>
</body>
</html>
